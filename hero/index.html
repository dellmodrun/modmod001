<script>
  {
    const root = document.documentElement;
    const host = parent !== window ? parent.document : null;
    const system = parent.matchMedia('(prefers-color-scheme: dark)');
    const sync = () => {
      const chosen = host?.documentElement.dataset.theme;
      const dark = chosen ? chosen === 'dark' : system.matches;
      root.dataset.theme = dark ? 'dark' : 'light';
    };
    sync();
    system.addEventListener('change', sync);
    if (host) {
      new MutationObserver(sync).observe(host.documentElement, {
        attributeFilter: ['data-theme']
      });
      const font = host.querySelector('link[rel="preload"][as="font"][href*="recursive"]');
      if (font) {
        const face = document.createElement('style');
        face.textContent = `@font-face { font-family: "Recursive"; src: url("${font.href}")
          format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }`;
        document.head.append(face);
      }
      const caption = host.querySelector('section[data-hero] hero-copy');
      const mirror = () => {
        const box = document.querySelector('.copy');
        if (!box || !caption || !frameElement) return;
        const c = caption.getBoundingClientRect();
        const f = frameElement.getBoundingClientRect();
        Object.assign(box.style, {
          left: `${c.left - f.left}px`, top: `${c.top - f.top}px`,
          width: `${c.width}px`, height: `${c.height}px`
        });
      };
      addEventListener('DOMContentLoaded', mirror);
      if (caption) new ResizeObserver(mirror).observe(caption);
      addEventListener('resize', mirror);
      addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) return;
        parent.dispatchEvent(new KeyboardEvent('keydown', e));
      });
      addEventListener('DOMContentLoaded', () => {
        const stage = document.querySelector('.stage');
        const done = () => stage.matches('[data-live], [data-error]');
        const tell = () => parent.postMessage('ready', '*');
        if (done()) return tell();
        new MutationObserver((_, seen) => {
          if (!done()) return;
          seen.disconnect();
          tell();
        }).observe(stage, { attributeFilter: ['data-live', 'data-error'] });
      });
    }
  }
</script>

<style>
  :root {

  * { box-sizing: border-box; letter-spacing: 0.02em; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--surface); }
  body { font: 400 12px/1.25 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .hero { position: relative; height: 100%; }
  .stage {
    position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: pan-y;
    &[data-dragging] { cursor: grabbing; }
    &:focus:not(:focus-visible) { outline: none; }
    & canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  }
  .cursor {
    position: absolute; inset: 0; pointer-events: none;
    &::before, &::after {
      content: ''; position: absolute;
      background: color-mix(in srgb, var(--ink) 10%, transparent);
    }
    &::before { top: 0; bottom: 0; left: 0; width: var(--hair); transform: translateX(var(--x)); }
    &::after { left: 0; right: 0; top: 0; height: var(--hair); transform: translateY(var(--y)); }
    & span {
      position: absolute;
      left: min(calc(var(--x) + 6px), calc(100% - 84px));
      top: min(calc(var(--y) + 4px), calc(100% - 16px));
      font-size: 10px; white-space: nowrap; color: var(--sheet);
    }
  }
  .copy { position: absolute; pointer-events: none; }
  .stage canvas, .overlay { opacity: 0; transition: opacity 0.4s; }
  .stage[data-live] canvas, .stage[data-live] .overlay { opacity: 1; }
  .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: scale-down; pointer-events: none;
    opacity: 0; animation: poster-in 0.4s 1.5s forwards;
  }
  @media (width >= 960px) { .poster { translate: 0 4%; } }
  .stage[data-error] .poster { animation: none; opacity: 1; }
  .stage[data-live] .poster { display: none; }
  @keyframes poster-in { to { opacity: 1; } }
  :root[data-theme="dark"] .poster { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; }
  .notice {
    position: absolute; top: calc(var(--margin) - 6px); right: calc(var(--margin) + 16px);
    margin: 0; z-index: 1;
    font-size: 10px; line-height: 12px; color: var(--mid);
  }
  .overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; user-select: none; -webkit-user-select: none;
    font-family: var(--mono); font-variation-settings: "MONO" 0.5;
    font-variant-numeric: tabular-nums;
    & .label { font-size: 9px; fill: var(--label); pointer-events: auto; }
    & .part { font-size: 8px; fill: var(--part); }
    & .leader { fill: none; stroke: var(--rule); stroke-width: var(--hair); stroke-dasharray: 3 2; }
    & .marker { fill: var(--surface); stroke: var(--part); stroke-width: var(--hair); }
    & .leader.active, & .marker.active { stroke: var(--accent); }
    & .marker.active { fill: var(--accent); }
    & text.active, & text.active .part { fill: var(--ink); }
    & .sheet, & .sheet-datum, & .sheet-leader {
      fill: none; stroke: var(--rule); stroke-width: var(--hair);
    }
    & .sheet-datum { stroke-dasharray: 12 3 2 3; }
    & .sheet-leader { stroke-dasharray: 3 2; }
    & .sheet-fill { fill: var(--surface); }
    & .sheet-text, & .sheet-key { font-size: 10px; fill: var(--sheet); }
    & .sheet-key { fill: var(--sheet-key); }
  }
  @media (width < 960px) { :root { --margin: 16px; } }
  @media (prefers-reduced-motion: reduce) {
    .stage canvas, .overlay { transition: none; }
    .poster { animation-duration: 0s; }
  }
